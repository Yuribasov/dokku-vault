name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and plugin version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::release tag must be semantic version like v0.2.0 or v0.2.0-rc.1"
            exit 1
          fi

          version="${tag#v}"
          declared_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' plugin.toml)"
          if [[ "$declared_version" != "$version" ]]; then
            echo "::error::plugin.toml version $declared_version does not match tag $tag"
            exit 1
          fi

      - name: Build release archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive_name="dokku-vault-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar "$GITHUB_SHA" | gzip -9n > "dist/$archive_name"
          (
            cd dist
            sha256sum "$archive_name" > "$archive_name.sha256"
          )

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(dist/*.tar.gz dist/*.sha256)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            exit 0
          fi

          release_flags=(--verify-tag --generate-notes --title "$tag")
          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$tag" "${assets[@]}" "${release_flags[@]}"
